# 이름을 적지 않으면 폴더 이름이 쓰인다. 폴더 위치와 상관없이 같은 이름을 쓰도록 고정한다.
name: selfspar-backend

services:
  db:
    image: postgres:18
    env_file: .env
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래에 데이터를 둔다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports가 없다: DB는 web 컨테이너에서만 접속할 수 있고 내 컴퓨터 밖으로 열리지 않는다.

  # 점검 요청을 web에서 worker로 넘기는 우편함. web과 worker만 접속한다(ports 없음).
  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      # Dockerfile의 web 단계까지만 만든다. git·점검 도구가 없는 이미지다.
      target: web
      args:
        # 로컬 개발이라 개발용 의존성(dev 그룹)도 설치한다.
        UV_NO_DEV: "false"
    # runserver는 코드가 바뀌면 스스로 다시 읽는다.
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      # 코드를 고치면 컨테이너를 다시 만들지 않아도 바로 반영된다.
      - .:/app
    ports:
      # 127.0.0.1에만 연다. 같은 와이파이의 다른 기기에서는 접속할 수 없다.
      # 8000번은 다른 프로젝트가 쓰고 있어서 내 컴퓨터 쪽은 8800번을 쓴다.
      - "127.0.0.1:8800:8000"
    depends_on:
      db:
        # DB가 접속을 받을 준비가 된 뒤에 web을 띄운다.
        condition: service_healthy
      redis:
        condition: service_healthy

  # 점검을 실제로 실행하는 곳. git과 점검 도구가 들어 있는 worker 단계 이미지를 쓴다.
  worker:
    build:
      context: .
      target: worker
      args:
        UV_NO_DEV: "false"
    # Celery는 스스로 코드를 다시 읽지 않아서, watchfiles가 .py 파일 변경을 감지하면 worker를 다시 띄운다(cookiecutter-django와 같은 방식).
    # 다시 띄울 때 실행 중이던 점검은 중단된다. 로컬 개발용이다.
    command: ["watchfiles", "--filter", "python", "celery.__main__.main", "--args", "-A config worker --loglevel=info --concurrency=2"]
    env_file: .env
    volumes:
      - .:/app
      # 점검할 저장소가 있는 내 컴퓨터 폴더. 컨테이너 안에서도 같은 경로로 붙여서 대상에 적은 경로를 그대로 쓴다.
      # 읽기 전용(ro)이라 점검 도구가 코드를 바꿀 수 없다.
      - ${SELFSPAR_REPO_ROOT:?.env에 SELFSPAR_REPO_ROOT를 적으세요}:${SELFSPAR_REPO_ROOT}:ro
      # 도구가 낸 원본 결과 파일. 컨테이너를 다시 만들어도 남는다.
      - scanresults:/data/scan-results
      # trivy 취약점 DB(내려받기 약 135MB, 풀면 약 1.8GB). 점검할 때마다 내려받지 않게 남겨 두고, 오래되면 trivy가 알아서 새로 받는다.
      - trivycache:/data/trivy-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  scanresults:
  trivycache:
