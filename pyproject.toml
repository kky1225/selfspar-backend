# 의존성 정의. 정확한 버전(간접 의존성 포함)과 파일 해시는 uv.lock에 고정된다.
# 추가: uv add 패키지 / 개발용 추가: uv add --dev 패키지 / 고친 뒤 잠금 갱신: uv lock
# [build-system]이 없어서 이 프로젝트 자체는 패키지로 설치되지 않고 의존성만 설치된다(Django는 manage.py로 실행).

[project]
name = "selfspar"
version = "0.1.0"
description = "내 서비스를 배포 전에 스스로 점검하는 로컬 보안 점검 대시보드"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    # PostgreSQL 연결 드라이버. [binary]는 컴파일 없이 바로 설치되는 버전이다.
    "psycopg[binary]>=3.3.9",
    # 테스트 계정 비밀번호를 암호화해서 저장한다(Fernet).
    "cryptography>=50.0.2",
    # 오래 걸리는 점검을 web 요청과 따로, worker에서 실행한다.
    # [redis]를 붙이면 Celery가 맞는 버전의 Redis 드라이버를 함께 고른다(Celery 공식 설치 방법).
    "celery[redis]>=5.7.0",
]

[dependency-groups]
# 개발할 때만 쓰는 것. 운영 이미지에는 설치하지 않는다(Dockerfile의 UV_NO_DEV).
dev = [
    # 코드가 바뀌면 worker를 자동으로 다시 띄운다.
    "watchfiles>=1.3.0",
]
